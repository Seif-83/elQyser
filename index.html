
<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>القيصر للعطور</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <style>
      html {
        scroll-behavior: smooth;
      }
      body {
        font-family: 'Tajawal', sans-serif;
        background-color: #fdfaf6;
      }
      .font-serif-ar {
        font-family: 'Amiri', serif;
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1;
      }
      ::-webkit-scrollbar-thumb {
        background: #8b5e3c;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #5d4037;
      }

      /* Smooth transition animations */
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes slideInFromLeft {
        from {
          opacity: 0;
          transform: translateX(-30px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @keyframes slideInFromRight {
        from {
          opacity: 0;
          transform: translateX(30px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @keyframes zoomIn {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      .section-fade-in {
        animation: fadeInUp 0.8s ease-out forwards;
      }

      .hero-fade-in {
        animation: fadeInUp 1s ease-out forwards;
      }

      .card-fade-in {
        animation: fadeInUp 0.6s ease-out forwards;
      }

      .animate-fadeIn {
        animation: fadeIn 0.3s ease-out forwards;
      }

      .stagger-item {
        opacity: 0;
      }

      .stagger-item.animate {
        animation: fadeInUp 0.6s ease-out forwards;
      }

      :root {
        --ivory: #f7f1e3;
        --emerald: #1f3a32;
        --copper: #b87333;
        --espresso: #211a16;
        --dusty-rose: #8b4a4a;
        --champagne: #ead9bc;
      }

      body {
        background-color: var(--ivory);
      }

      [class~="bg-[#fdfaf6]"],
      [class~="bg-amber-50"] {
        background-color: var(--ivory) !important;
      }

      [class~="bg-white"] {
        background-color: #fffaf0 !important;
      }

      [class~="bg-amber-100"] {
        background-color: var(--champagne) !important;
      }

      [class~="bg-amber-200"] {
        background-color: #d8c19a !important;
      }

      [class~="bg-amber-600"] {
        background-color: var(--copper) !important;
      }

      [class~="bg-amber-700"] {
        background-color: #925b2a !important;
      }

      [class~="bg-amber-800"],
      [class~="bg-amber-900"] {
        background-color: var(--emerald) !important;
      }

      [class~="bg-amber-950"] {
        background-color: var(--espresso) !important;
      }

      [class~="text-amber-900"] {
        color: var(--espresso) !important;
      }

      [class~="text-amber-800"] {
        color: var(--emerald) !important;
      }

      [class~="text-amber-700"],
      [class~="text-amber-600"] {
        color: var(--copper) !important;
      }

      [class~="text-amber-400"],
      [class~="text-amber-200"],
      [class~="text-amber-50"] {
        color: var(--champagne) !important;
      }

      [class~="border-amber-50"],
      [class~="border-amber-100"] {
        border-color: var(--champagne) !important;
      }

      [class~="border-amber-200"] {
        border-color: #d8c19a !important;
      }

      [class~="bg-amber-800\/30"] {
        background-color: rgb(29 61 58 / 30%) !important;
      }

      [class~="bg-amber-800\/20"] {
        background-color: rgb(184 115 51 / 20%) !important;
      }

      [class~="text-green-600"],
      [class~="bg-green-600"] {
        color: var(--ivory) !important;
        background-color: var(--emerald) !important;
      }

      [class~="bg-green-700"] {
        background-color: #152a24 !important;
      }

      [class~="hover\\:bg-amber-700"]:hover {
        background-color: #925b2a !important;
      }

      [class~="hover\\:bg-amber-800"]:hover {
        background-color: var(--emerald) !important;
      }

      [class~="hover\\:bg-amber-100"]:hover,
      [class~="hover\\:bg-amber-200"]:hover {
        background-color: var(--champagne) !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>  </body>
</html>
